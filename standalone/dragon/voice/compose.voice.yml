# DRAGON (Docker standalone, GPU NVIDIA): solo voz a texto y texto a voz.
# Las imagenes las sube deploy.ps1 a registry.moodrob.com. En dragon:
#   docker compose -f compose.voice.yml -p mood-voice pull
#   docker compose -f compose.voice.yml -p mood-voice up -d
# (o  .\deploy.ps1 -Services stt,tts -Deploy -DragonContext dragon  desde tu equipo)
# Los valores van aqui directamente. Si pones SERVICE_TOKEN, pon el mismo en compose.swarm.yml.
services:
  stt:
    image: registry.moodrob.com/mood-rlcd/stt:latest
    restart: unless-stopped
    environment:
      WHISPER_MODEL: large-v3-turbo
      SERVICE_TOKEN: ""
    volumes:
      - stt-models:/models
    ports:
      - "0.0.0.0:8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  tts:
    image: registry.moodrob.com/mood-rlcd/tts:latest
    restart: unless-stopped
    environment:
      PIPER_VOICE: es_ES-davefx-medium
      SERVICE_TOKEN: ""
    volumes:
      - tts-voices:/voices
    ports:
      - "0.0.0.0:8002:8000"
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

volumes:
  stt-models:
  tts-voices:
