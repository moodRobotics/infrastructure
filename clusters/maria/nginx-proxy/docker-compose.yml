version: '3.8'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    networks:
      - maria-net
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - maria_certs:/etc/nginx/certs:ro
      - maria_vhost:/etc/nginx/vhost.d
      - maria_html:/usr/share/nginx/html
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  acme-companion:
    image: nginxproxy/acme-companion:latest
    networks:
      - maria-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - maria_certs:/etc/nginx/certs:rw
      - maria_vhost:/etc/nginx/vhost.d
      - maria_html:/usr/share/nginx/html
      - maria_acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=admin@grupohereda.com
      - NGINX_PROXY_CONTAINER=nginx-proxy
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  maria-net:
    external: true

volumes:
  maria_certs:
  maria_vhost:
  maria_html:
  maria_acme:
