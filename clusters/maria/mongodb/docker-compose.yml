version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_production_password}
    networks:
      - maria-backend
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == maria001
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  maria-backend:
    driver: overlay
    attachable: true

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
