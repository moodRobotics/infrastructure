services:
  frontend:
    image: registry.moodrob.com/maui/frontend:latest
    ports:
      - target: 3000
        published: 3097
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood999
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  api:
    image: registry.moodrob.com/maui/api:latest
    ports:
      - target: 4040
        published: 5097
        protocol: tcp
        mode: host
    environment:
      NODE_ENV: production
      PORT: 4040
      LOG_LEVEL: info
      DATABASE_URL: postgres://maui:maui_secret_password@postgis:5432/maui
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: '*'
      JWT_SECRET: maui_wayfinder_polynesian_secret_key_2026
      MAUI_MASTER_API_KEY: maui_live_k8f92j49d8s7a6f5g4h3j2k1
      # Ajustar a la URL real de DeepNexus / GOD-EYE dentro del swarm
      DEEPNEXUS_API_URL: http://mood001:3081
      DEEPNEXUS_API_KEY: dnx_dev_maui_bridge_key
      GOD_EYE_API_URL: http://mood002:3030
      # Nodo OSM local de España (servicios nominatim/overpass de este stack).
      # Mientras importan, la cascada sigue con CartoCiudad.
      OSM_LOCAL_ENABLED: 'true'
      OSM_LOCAL_NOMINATIM_URL: http://nominatim:8080
      OSM_LOCAL_OVERPASS_URL: http://overpass/api/interpreter
      # Ruta same-origin: nginx del frontend proxifica /tiles/ -> tileserver (sin CORS ni mixed content).
      OSM_LOCAL_TILES_URL: /tiles
      OSM_LOCAL_TILES_STYLE: dark
      CROSSLINK_RADIUS_METERS: 350
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood999
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  worker:
    image: registry.moodrob.com/maui/worker:latest
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://maui:maui_secret_password@postgis:5432/maui
      REDIS_URL: redis://redis:6379
      DEEPNEXUS_API_URL: http://mood001:3081
      DEEPNEXUS_API_KEY: dnx_dev_maui_bridge_key
      FRESHNESS_SWEEP_INTERVAL_MINUTES: 30
      CROSSLINK_RADIUS_METERS: 350
      OSM_LOCAL_ENABLED: 'true'
      OSM_LOCAL_OVERPASS_URL: http://overpass/api/interpreter
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood999
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  postgis:
    image: postgis/postgis:16-3.4
    ports:
      - target: 5432
        published: 5438
        protocol: tcp
        mode: host
    environment:
      POSTGRES_USER: maui
      POSTGRES_PASSWORD: maui_secret_password
      POSTGRES_DB: maui
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maui -d maui']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood999
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      update_config:
        order: stop-first

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood999
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Nodo OpenStreetMap España: geocodificación sin límites de tasa externos.
  # Primer arranque (en mood001): descarga spain-latest.osm.pbf (~1,3 GB) e importa (varias horas).
  # Listo cuando `curl http://nominatim:8080/status` devuelve OK.
  nominatim:
    image: mediagis/nominatim:4.4
    # Publicado para otros desarrollos (GOD-EYE, TM2...): http://<nodo>:8092/search?q=...&format=jsonv2
    ports:
      - target: 8080
        published: 8092
        protocol: tcp
        mode: ingress
    environment:
      PBF_URL: https://download.geofabrik.de/europe/spain-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/europe/spain-updates/
      IMPORT_WIKIPEDIA: 'false'
      NOMINATIM_PASSWORD: maui_osm_password
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
      - nominatim_flatnode:/nominatim/flatnode
      # Equivalente a shm_size (no soportado en swarm)
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood001
      resources:
        limits:
          memory: 12G
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3
      update_config:
        order: stop-first

  # Overpass propio para el descubrimiento del worker (consultas por bbox, sin áreas).
  # Primer arranque (en mood001): descarga el PBF de España, lo convierte e indexa (1-3 horas).
  overpass:
    image: wiktorn/overpass-api:latest
    # Publicado para otros desarrollos: POST http://<nodo>:8093/api/interpreter (data=<consulta OverpassQL>)
    ports:
      - target: 80
        published: 8093
        protocol: tcp
        mode: ingress
    environment:
      OVERPASS_MODE: init
      OVERPASS_META: 'no'
      OVERPASS_USE_AREAS: 'false'
      OVERPASS_PLANET_URL: https://download.geofabrik.de/europe/spain-latest.osm.pbf
      OVERPASS_PLANET_PREPROCESS: 'mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf'
      OVERPASS_DIFF_URL: https://download.geofabrik.de/europe/spain-updates/
      OVERPASS_UPDATE_SLEEP: 3600
      OVERPASS_COMPRESSION: gz
    volumes:
      - overpass_data:/db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood001
      resources:
        limits:
          memory: 6G
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3
      update_config:
        order: stop-first

  # Generador de teselas vectoriales de España (planetiler -> OpenMapTiles .mbtiles).
  # Servicio de un solo uso: si spain.mbtiles ya existe termina al instante.
  # Primer arranque: descarga spain-latest.osm.pbf y genera (~30-90 min). Para regenerar:
  # borra /data/mbtiles/spain.mbtiles del volumen tiles_data y redespliega.
  tilegen:
    image: ghcr.io/onthegomap/planetiler:latest
    entrypoint: ['sh', '-c']
    command:
      - |
        mkdir -p /data/mbtiles /data/sources /data/tmp
        if [ -f /data/mbtiles/spain.mbtiles ]; then
          echo "spain.mbtiles ya existe, nada que hacer"
        else
          java -Xmx5g -cp @/app/jib-classpath-file com.onthegomap.planetiler.Main --area=spain --download             --download_dir=/data/sources --tmpdir=/data/tmp             --output=/data/mbtiles/spain.tmp.mbtiles --force           && mv /data/mbtiles/spain.tmp.mbtiles /data/mbtiles/spain.mbtiles           && rm -rf /data/tmp
        fi
    volumes:
      - tiles_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood001
      resources:
        limits:
          memory: 8G
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3

  # Servidor de teselas: sirve spain.mbtiles con el estilo oscuro (dark-matter, sin API key).
  # Hasta que tilegen termine, reintenta cada minuto. Accesible desde el navegador en /tiles/
  # (proxy del frontend). Estilo: /tiles/styles/dark/style.json
  tileserver:
    image: maptiler/tileserver-gl:v4.4.10
    # La imagen corre como `node`, pero el volumen lo crea root (tilegen): sin esto no puede crear styles/
    user: root
    # Publicado en el swarm para otros desarrollos: http://<cualquier-nodo>:8091/ (estilo: /styles/dark/style.json)
    ports:
      - target: 8080
        published: 8091
        protocol: tcp
        mode: ingress
    entrypoint: ['sh', '-c']
    command:
      - |
        cd /data
        # fonts/ y sprites/ deben existir (aunque vacíos): el estilo usa glyphs y sprites remotos de openmaptiles
        mkdir -p styles fonts sprites
        until [ -f mbtiles/spain.mbtiles ]; do echo "esperando spain.mbtiles..."; sleep 30; done
        # La imagen no trae wget/curl: el estilo se descarga con el fetch de node y se apunta al mbtiles local
        until [ -s styles/dark.json ]; do
          rm -f styles/dark.json
          node -e "
            fetch('https://raw.githubusercontent.com/openmaptiles/dark-matter-gl-style/master/style.json')
              .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
              .then(style => {
                for (const src of Object.values(style.sources)) {
                  if (src.type === 'vector') { delete src.tiles; src.url = 'mbtiles://{spain}'; }
                }
                require('fs').writeFileSync('styles/dark.json', JSON.stringify(style));
              })
              .catch(e => { console.error('No se pudo descargar el estilo: ' + e.message); process.exit(1); })
          " || { echo "reintentando en 30s..."; sleep 30; }
        done
        cat > config.json <<'EOF'
        {"options":{"paths":{"root":"/data","fonts":"fonts","sprites":"sprites","styles":"styles","mbtiles":"mbtiles"}},
         "styles":{"dark":{"style":"dark.json"}},
         "data":{"spain":{"mbtiles":"spain.mbtiles"}}}
        EOF
        exec node /usr/src/app/ -p 8080 -c /data/config.json
    volumes:
      - tiles_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == mood001
      restart_policy:
        condition: any
        delay: 30s

volumes:
  tiles_data:
    driver: local
  postgis_data:
    driver: local
  redis_data:
    driver: local
  nominatim_data:
    driver: local
  nominatim_flatnode:
    driver: local
  overpass_data:
    driver: local
