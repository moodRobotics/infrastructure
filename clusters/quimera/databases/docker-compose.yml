version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_quimera_password}
    networks:
      - quimera-db
    volumes:
      - quimera_mongo_data:/data/db
      - quimera_mongo_config:/data/configdb
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          # Preferencia nodo primario de datos mood001
          - node.hostname == mood001
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  quimera-db:
    driver: overlay
    attachable: true

volumes:
  quimera_mongo_data:
    driver: local
  quimera_mongo_config:
    driver: local
