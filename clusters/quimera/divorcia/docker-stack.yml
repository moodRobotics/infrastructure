# Stack de producción para Portainer (Docker Swarm).
#
# Autocontenido a propósito: no usa variables de entorno, ficheros .env ni secretos externos de
# Docker. Se pega tal cual en Portainer > Stacks > Add stack > Web editor y despliega.
#
# Este fichero es la PLANTILLA que se publica con el repositorio, así que solo lleva huecos
# CAMBIAR_*. El que se pega en Portainer es `stack.yml`, que se genera con
#
#     python ops/build_stack.py
#
# a partir de `deploy.env` (copia de deploy.env.example). Tanto deploy.env como stack.yml están
# ignorados por git porque llevan la contraseña de la base, la clave de S3 y el secreto de firma.
# Si prefieres, rellena los huecos a mano y pega el resultado.
#
# Sin proxy inverso propio: el TLS y el dominio (divorcia.1-tool.com) los pone el nginx externo,
# que apunta a http://<cualquier nodo del swarm>:<puerto web> (3066 por defecto). El nginx del frontend sirve
# la web y reenvía /api al backend por la red interna; el backend se publica además en
# <puerto api> (5066 por defecto) para acceso directo a la API.
# Postgres y Redis tienen volúmenes locales, así que se fijan por hostname al nodo de datos
# (CAMBIAR_NODO_DATOS, p. ej. mood002); comprueba el nombre con `docker node ls`.
#
# Huecos: CAMBIAR_DOMINIO (para CORS), CAMBIAR_PUERTO_WEB, CAMBIAR_PUERTO_API, CAMBIAR_REGISTRO (sin protocolo, p. ej.
# registry.moodrob.com), CAMBIAR_TAG, CAMBIAR_S3_ENDPOINT, CAMBIAR_S3_ACCESS_KEY, CAMBIAR_S3_SECRET_KEY,
# CAMBIAR_POSTGRES_PASSWORD, CAMBIAR_SECRET_KEY, CAMBIAR_NODO_DATOS.

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: divorcia
      POSTGRES_USER: divorcia
      POSTGRES_PASSWORD: sd9fs0d9fjsodfjnosdifjsd
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divorcia -d divorcia"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.hostname == CAMBIAR_NODO_DATOS
      restart_policy:
        condition: any
        delay: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.hostname == CAMBIAR_NODO_DATOS
      restart_policy:
        condition: any
        delay: 5s

  backend:
    image: registry.moodrob.com/divorcia/backend:CAMBIAR_TAG
    # El entrypoint aplica las migraciones (alembic upgrade head) antes de arrancar uvicorn.
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg://divorcia:sd9fs0d9fjsodfjnosdifjsd@db:5432/divorcia
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: CAMBIAR_S3_ENDPOINT
      S3_BUCKET: expedientes
      S3_ACCESS_KEY: CAMBIAR_S3_ACCESS_KEY
      S3_SECRET_KEY: CAMBIAR_S3_SECRET_KEY
      SECRET_KEY: CAMBIAR_SECRET_KEY
      CORS_ORIGINS: '["https://CAMBIAR_DOMINIO"]'
    ports:
      - target: 8000
        published: 5066 # CAMBIAR_PUERTO_API
        protocol: tcp
        mode: ingress
    networks:
      - internal
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  worker:
    image: registry.moodrob.com/divorcia/worker:CAMBIAR_TAG
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg://divorcia:sd9fs0d9fjsodfjnosdifjsd@db:5432/divorcia
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: CAMBIAR_S3_ENDPOINT
      S3_BUCKET: expedientes
      S3_ACCESS_KEY: CAMBIAR_S3_ACCESS_KEY
      S3_SECRET_KEY: CAMBIAR_S3_SECRET_KEY
      SOFFICE_BIN: soffice
    networks:
      - internal
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  frontend:
    # nginx: sirve el build de Vite y reenvía /api al servicio backend (frontend/nginx.conf).
    image: registry.moodrob.com/divorcia/frontend:CAMBIAR_TAG
    ports:
      - target: 80
        published: 3066 # CAMBIAR_PUERTO_WEB
        protocol: tcp
        mode: ingress
    networks:
      - internal
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

networks:
  internal:
    driver: overlay
    attachable: false

volumes:
  pgdata:
  redisdata:
