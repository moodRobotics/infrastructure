version: '3.8'

# Stack: dsh (DeepSeek Harness)
# Cluster: Quimera (Docker Swarm - mood001, mood003, mood999)
# Ingress: Nginx Proxy Web / Cloudflare / DonDominio (moodrobotics.com)

services:
  dsh:
    image: ghcr.io/moodrobotics/dsh:release
    environment:
      - NODE_ENV=production
      - DSH_HOST=0.0.0.0
      - DSH_PORT=3080
      - DSH_HOME=/data/.dsh
      - DSH_WORKSPACE=/data/workspace
      - OPENAI_BASE_URL=http://10.100.99.10:11434/v1
      - OPENAI_API_KEY=dummy_key
      - DSH_MODEL=metalspork/qwen3.8-flash-next-ud:UD-IQ3_XXS
      # Configuración de Ingress para Nginx Proxy Web hacia Cloudflare / DonDominio
      - VIRTUAL_HOST=dsh.moodrobotics.com
      - VIRTUAL_PORT=3080
    ports:
      - "3091:3080"
    volumes:
      - dsh-storage:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

# Añadimos un explorador de archivos web súper ligero
  filebrowser:
    image: filebrowser/filebrowser:latest
    ports:
      - "4091:80"
    volumes:
      - dsh_projects:/srv
      - filebrowser_db:/database

volumes:
  dsh-storage:
    driver: local
  filebrowser_db:
    driver: local
