version: '3.8'

# Docker Registry Privado Autoalojado
# Utilizado por CI/CD para compilar y subir imágenes antes del despliegue en Portainer

services:
  registry:
    image: registry:2
    container_name: mood-docker-registry
    restart: always
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # Autenticación htpasswd básica opcional (descomentar si se usa)
      # REGISTRY_AUTH: htpasswd
      # REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      # REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./auth:/auth:ro
    networks:
      - shared-net

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: mood-docker-registry-ui
    restart: always
    ports:
      - "5001:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Mood Robotics Private Registry
      - REGISTRY_URL=http://registry:5000
      - DELETE_IMAGES=true
    depends_on:
      - registry
    networks:
      - shared-net

networks:
  shared-net:
    driver: bridge

volumes:
  registry_data:
    driver: local
