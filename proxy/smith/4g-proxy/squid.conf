# Squid configuration for Smith 4G Proxy (Raspberry Pi 3B+)
http_port 3128

# Access Control Lists (ACLs)
acl localnet src 192.168.40.0/24  # Red local de oficina
acl localnet src 10.90.0.0/24    # Red Mercedes (via Mikrotik)
acl localhost src 127.0.0.1/32

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 21          # ftp
acl Safe_ports port 1025-65535  # unregistered ports
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager

http_access allow localnet
http_access allow localhost
http_access deny all

# Salida forzada por la interfaz o IP asignada por el pincho 4G de Orange
# Reemplazar con la IP asignada a wwan0 / ppp0 o definir mediante tcp_outgoing_address
# tcp_outgoing_address 10.x.x.x

# Ocultar headers de origen para privacidad
forwarded_for off
request_header_access From deny all
request_header_access Server deny all
request_header_access User-Agent deny all
request_header_access Referer deny all
